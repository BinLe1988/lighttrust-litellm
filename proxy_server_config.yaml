litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 600
  telemetry: false
  success_callback: ["langfuse"]
  callbacks:
    - custom_auth.MetadataValidator
    - custom_auth.BudgetTracker

general_settings:
  master_key: sk-litellm-master-key-1234
